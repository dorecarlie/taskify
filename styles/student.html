<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard — Taskify</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cal-cell {
            min-height: 55px;
            background: white;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            position: relative;
        }
        .task-dot {
            width: 5px;
            height: 5px;
            background: var(--np-navy);
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 10px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .reminder-card {
            background: white;
            border-left: 5px solid var(--np-orange);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="status-bar">
            <a href="index.html" style="color: var(--np-orange);">‹ Back to Roles</a>
            <span id="clock">9:41</span>
        </div>
        
        <div class="page-content">
            <h1 class="welcome-title" id="userGreet" style="text-transform: uppercase;">HELLO!</h1>
            
            <div class="view-tabs">
                <button id="listTab" class="view-btn" onclick="switchView('list')">List</button>
                <button id="calTab" class="view-btn" onclick="switchView('calendar')">Calendar</button>
                <button id="remTab" class="view-btn" onclick="switchView('reminders')">Reminders</button>
            </div>

            <!-- Task Input Section -->
            <div id="inputArea" class="task-form-card" style="display: none;">
                <div class="field-group">
                    <label class="field-label">ASSIGNMENT NAME</label>
                    <input type="text" id="tTitle" class="field-input" placeholder="Enter task...">
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="field-group" style="flex:2;">
                        <label class="field-label">DATE</label>
                        <input type="date" id="tDate" class="field-input">
                    </div>
                    <div class="field-group" style="flex:1;">
                        <label class="field-label">PRIORITY</label>
                        <input type="number" id="tPrio" class="field-input" value="1" min="1" max="5">
                    </div>
                </div>
                <button onclick="addTask()" class="auth-submit-btn">ADD TASK</button>
            </div>

            <div id="listView" style="display: none;"></div>

            <div id="calendarView" style="display: none;">
                <div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:2px; background:var(--np-navy); border:1px solid var(--np-navy); border-radius: 8px 8px 0 0; overflow: hidden; margin-top: 20px;">
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">S</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">M</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">T</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">W</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">T</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">F</div>
                    <div style="color:white; text-align:center; font-size:11px; font-weight:bold; padding:10px;">S</div>
                </div>
                <div id="calendarGrid" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:2px; background:#ddd; border-radius: 0 0 8px 8px; overflow: hidden;"></div>
            </div>

            <div id="remindersView" style="display:none;">
                <p style="font-size:11px; font-weight:bold; color:var(--np-navy); margin-bottom:12px;">ACTIVE ALERTS</p>
                <div id="reminderList"></div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('studentTasks') || '[]');

        window.onload = () => {
            const name = localStorage.getItem('currentUser');
            if(name) document.getElementById('userGreet').innerText = `HELLO, ${name.toUpperCase()}!`;
            // CHANGED: Defaulting to 'list' view instead of 'calendar'
            switchView('list'); 
        };

        function switchView(view) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('remindersView').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';

            if (view === 'list') {
                document.getElementById('listView').style.display = 'block';
                document.getElementById('inputArea').style.display = 'block';
            } else if (view === 'calendar') {
                document.getElementById('calendarView').style.display = 'block';
            } else if (view === 'reminders') {
                document.getElementById('remindersView').style.display = 'block';
            }
            
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(view.substring(0,3) + 'Tab').classList.add('active');
            renderAll();
        }

        function addTask() {
            const title = document.getElementById('tTitle').value;
            const date = document.getElementById('tDate').value;
            const prio = document.getElementById('tPrio').value;
            if(!title || !date) return alert("Please enter task details");

            tasks.push({ title, date, prio });
            localStorage.setItem('studentTasks', JSON.stringify(tasks));
            document.getElementById('tTitle').value = '';
            renderAll();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('studentTasks', JSON.stringify(tasks));
            renderAll();
        }

        function renderAll() {
            renderList();
            renderCalendar();
            renderReminders();
        }

        function renderList() {
            const container = document.getElementById('listView');
            container.innerHTML = tasks.slice().reverse().map((t, i) => {
                const originalIndex = tasks.length - 1 - i;
                return `
                <div class="task-item">
                    <div><strong>${t.title}</strong><br><small>${t.date}</small></div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="background:var(--np-navy); color:white; padding:4px 8px; border-radius:5px; font-size:10px;">P${t.prio}</span>
                        <button class="delete-btn" onclick="deleteTask(${originalIndex})">×</button>
                    </div>
                </div>
            `}).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const startPadding = 3; 
            const daysInMonth = 30;

            for (let i = 0; i < startPadding; i++) {
                grid.innerHTML += '<div class="cal-cell" style="background:#f4f7f9;"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `2026-04-${day < 10 ? '0'+day : day}`;
                const hasTask = tasks.some(t => t.date === dateStr);
                const isToday = day === 30; 

                grid.innerHTML += `
                    <div class="cal-cell" style="${isToday ? 'background:rgba(245, 132, 38, 0.1); border: 2px solid var(--np-orange);' : ''}">
                        <span style="${isToday ? 'color:var(--np-orange); font-weight:bold;' : 'color:var(--np-navy);'}">${day}</span>
                        ${hasTask ? '<div class="task-dot"></div>' : ''}
                    </div>`;
            }
        }

        function renderReminders() {
            const container = document.getElementById('reminderList');
            if(tasks.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:gray;">No reminders set.</p>';
                return;
            }
            container.innerHTML = tasks.map(t => `
                <div class="reminder-card">
                    <div style="font-size:18px;">📅</div>
                    <div>
                        <div style="font-weight:bold; font-size:13px; color:var(--np-navy);">Upcoming Deadline</div>
                        <div style="font-size:12px; color:var(--text-sub);">Your task <strong>${t.title}</strong> is scheduled for ${t.date}.</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
