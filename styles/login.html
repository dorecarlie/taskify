<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskify — Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <div class="status-bar">
            <span>11:11 AM</span>
            <span>Secure Access</span>
            <div class="status-icons">100%</div>
        </div>

        <div class="page-content" style="padding-top: 40px;">
            <div class="auth-header" style="text-align: center; margin-bottom: 30px;">
                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-sub">Enter your details to access Taskify</p>
            </div>

            <form onsubmit="event.preventDefault(); localStorage.setItem('currentUser', document.getElementById('fn').value); window.location.href='student.html';">
                <div class="field-group">
                    <label class="field-label">First Name</label>
                    <input type="text" id="fn" class="field-input" placeholder="Enter first name" required>
                </div>
                <div class="field-group">
                    <label class="field-label">Last Name</label>
                    <input type="text" class="field-input" placeholder="Enter last name" required>
                </div>
                <div class="field-group">
                    <label class="field-label">University Email</label>
                    <input type="email" class="field-input" placeholder="hawk@newpaltz.edu" required>
                </div>
                <div class="field-group">
                    <label class="field-label">Password</label>
                    <input type="password" class="field-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="auth-submit-btn">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
