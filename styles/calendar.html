<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskify — Calendar View</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            background: #eee;
            padding: 5px;
            border-radius: 10px;
        }
        .day-cell {
            background: white;
            min-height: 80px;
            padding: 5px;
            font-size: 10px;
            border-radius: 4px;
        }
        .day-header { font-weight: bold; text-align: center; padding: 10px 0; color: var(--student-accent); }
        .task-dot {
            background: var(--student-accent);
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            margin-top: 2px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="page-container" style="max-width: 600px;">
        <div class="status-bar"><a href="student.html">‹ Back</a><span>April 2026</span></div>
        
        <header>
            <h2 class="welcome-title">Calendar View</h2>
            <p class="welcome-sub">Visualizing your Map&lt;Date, List&gt;</p>
        </header>

        <div class="calendar-grid" id="calendarGrid">
            <div class="day-header">S</div><div class="day-header">M</div><div class="day-header">T</div>
            <div class="day-header">W</div><div class="day-header">T</div><div class="day-header">F</div><div class="day-header">S</div>
            </div>
    </div>

    <script>
        const grid = document.getElementById('calendarGrid');
        const savedTasks = JSON.parse(localStorage.getItem('studentTasks') || '[]');

        function generateCalendar() {
            // Create 30 days for April
            for (let i = 1; i <= 30; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `<strong>${i}</strong>`;

                // Filter tasks for this day (Matches your Java CalendarView map logic)
                const daysTasks = savedTasks.filter(t => {
                    const d = new Date(t.deadline);
                    return d.getDate() === i && d.getMonth() === 3; // April is index 3
                });

                daysTasks.forEach(t => {
                    cell.innerHTML += `<span class="task-dot">${t.title}</span>`;
                });

                grid.appendChild(cell);
            }
        }

        generateCalendar();
    </script>
</body>
</html>
