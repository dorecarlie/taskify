<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Taskify — Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <div class="status-bar"><span>9:41</span><span>100%</span></div>
        
        <div class="welcome-logo" style="text-align: center; padding-top: 40px;">
            <h1 class="welcome-title">Taskify</h1>
            <p class="welcome-sub">Student Planner</p>
        </div>

        <div class="role-selection">
            <p style="font-weight: 600; font-size: 14px; margin-left: 5px;">Continue as:</p>
            
            <a href="student.html" class="role-btn">
                <div class="role-btn-icon" style="background: #efecff;">🎓</div>
                <div class="role-btn-text">
                    <span class="role-name" style="color: var(--student-accent)">Student</span>
                    <span class="role-desc">Assignments & Tasks</span>
                </div>
            </a>

            <a href="admin.html" class="role-btn">
                <div class="role-btn-icon" style="background: #fff4e5;">🛡️</div>
                <div class="role-btn-text">
                    <span class="role-name" style="color: var(--admin-accent)">Admin</span>
                    <span class="role-desc">System Oversight</span>
                </div>
            </a>

            <a href="it.html" class="role-btn">
                <div class="role-btn-icon" style="background: #e0f7fa;">💻</div>
                <div class="role-btn-text">
                    <span class="role-name" style="color: var(--it-accent)">IT Support</span>
                    <span class="role-desc">Maintenance & Debug</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
